services:
  - type: web
    name: cadastro-clientes
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /var/data/clientes.sqlite3
    disk:
      name: clientes-data
      mountPath: /var/data
      sizeGB: 1
