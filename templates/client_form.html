{% extends "base.html" %}
{% block content %}<section class="intro compact"><p class="eyebrow">Cadastro</p><h1>{{ page_title }}</h1></section>
<form class="form" method="post" action="{% if client.id %}{{ url_for('update_client_page', client_id=client.id) }}{% else %}{{ url_for('create_client_page') }}{% endif %}">
<fieldset><legend>Dados pessoais</legend><div class="grid three"><label>Nome completo *<input name="nome" value="{{ client.nome|default('') }}" required></label><label>E-mail *<input type="email" name="email" value="{{ client.email|default('') }}" required></label><label>Telefone<input name="telefone" value="{{ client.telefone|default('') }}"></label></div></fieldset>
<fieldset><legend>Endereço</legend><div class="grid address"><label>Logradouro *<input name="logradouro" value="{{ client.logradouro|default('') }}" required></label><label>Número *<input name="numero" value="{{ client.numero|default('') }}" required></label><label>Complemento<input name="complemento" value="{{ client.complemento|default('') }}"></label></div><div class="grid three"><label>Bairro *<input name="bairro" value="{{ client.bairro|default('') }}" required></label><label>Cidade *<input name="cidade" value="{{ client.cidade|default('') }}" required></label><label>Estado *<input name="estado" maxlength="2" value="{{ client.estado|default('') }}" required></label><label>CEP *<input name="cep" value="{{ client.cep|default('') }}" required></label></div></fieldset>
<div class="form-actions"><a class="button muted" href="{{ url_for('index') }}">Cancelar</a><button class="button primary" type="submit">Salvar cliente</button></div></form>
{% endblock %}
